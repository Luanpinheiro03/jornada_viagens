<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Blog - Jornada Viagens</title>
  </head>
  <body>
    <header>
      <a
        class="logo"
        href="index.html"
        title="Retornar ao menu principal"
        target="_blank"
      >
        <img
          class="img-mobile"
          src="img/Logo-jornada-branca.png"
          alt="bussola logo Jornada Viagens"
        />
        <img
          class="img-desktop"
          src="img/logo-jornada-branco-desktop.png"
          alt="logo jornada Viagens branco"
        />
      </a>
      <div class="navigation-menu">
        <label for="menu"><img src="img/menu.png" alt="menu" /></label>
        <input type="checkbox" name="menu-principal" id="menu" hidden />

        <nav>
          <ul class="list-links">
            <li>
              <a
                class="active"
                href="blog.html"
                title="Acessar Blog"
                target="_blank"

            </li>
            <li>
              <a
                href="pacotes.html"
                title="Acessar Pacotes de Viagens"
                target="_blank"

              >
            </li>
            <li>
              <a href="contato.html" title="Acessar contato" target="_blank"
                >Contato</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <section class="hero-blog">
      <section class="hero-content-blog">
        <section class="section-title">
          <h1>Blog da Jornada</h1>
          <hr />
        </section>
        <p class="text-content">
          Histórias de viagens de nossos clientes. Inspire-se, encontre roteiros
          e dicas! Qual seu próximo destino?
        </p> 
      </section>
    </section>
